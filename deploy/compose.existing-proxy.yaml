name: wojiecihuo-blog
services:
  blog:
    image: caddy:2.11.4
    container_name: wojiecihuo-blog
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - existing_proxy
networks:
  existing_proxy:
    external: true
    name: multi-agent-cloud_default
volumes:
  caddy_data:
  caddy_config:
