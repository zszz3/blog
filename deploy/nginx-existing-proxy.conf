# Add alongside the existing API server block after taking a backup.
server {
    listen 80;
    server_name wojiecihuo.cn www.wojiecihuo.cn;

    # Resolve again after the blog container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $blog_origin wojiecihuo-blog:80;

    location / {
        proxy_pass http://$blog_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
