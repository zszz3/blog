name: Build and publish blog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 发布新版本或回退
        type: choice
        options: [publish, rollback]
        default: publish
      release:
        description: 回退版本（previous 表示上一版）
        type: string
        default: previous
permissions:
  contents: read
concurrency:
  group: blog-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test release switching and rollback
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test article views and chapter ordering
        run: node --experimental-strip-types --test scripts/article-model.test.mjs
      - name: Build pages, search and RSS
        run: pnpm build
        env:
          SITE_URL: https://wojiecihuo.cn
          PUBLIC_ICP_NUMBER: ${{ vars.PUBLIC_ICP_NUMBER }}
          PUBLIC_NEITUI_API_ENABLED: ${{ vars.NEITUI_API_ENABLED }}
      - name: Verify generated links and assets
        run: python3 scripts/verify_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Deployment setup status
        if: vars.ECS_DEPLOY_ENABLED != 'true'
        run: echo '网站已构建。首次配置服务器凭证并将 ECS_DEPLOY_ENABLED 设为 true 后，将自动发布到阿里云。' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ECS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wojiecihuo.cn
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this commit is no longer main
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: website-${{ github.sha }}
          path: dist
      - name: Publish complete release
        if: steps.current.outputs.publish == 'true'
        run: bash scripts/deploy.sh
        env:
          ECS_HOST: ${{ vars.ECS_HOST || '8.130.31.33' }}
          ECS_USER: ${{ vars.ECS_USER }}
          ECS_PORT: ${{ vars.ECS_PORT || '22' }}
          ECS_SITE_ROOT: ${{ vars.ECS_SITE_ROOT || '/opt/wojiecihuo/site' }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
  rollback:
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/main' && vars.ECS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Restore a checked release
        run: bash scripts/deploy.sh
        env:
          DEPLOY_OPERATION: rollback
          ROLLBACK_RELEASE: ${{ inputs.release }}
          ECS_HOST: ${{ vars.ECS_HOST || '8.130.31.33' }}
          ECS_USER: ${{ vars.ECS_USER }}
          ECS_PORT: ${{ vars.ECS_PORT || '22' }}
          ECS_SITE_ROOT: ${{ vars.ECS_SITE_ROOT || '/opt/wojiecihuo/site' }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
